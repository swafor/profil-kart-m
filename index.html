<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#030406">

    <title>Luka Mersin | VIP Portföy & Digital Experience</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6.5.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #9a6b1f;
            --gold-gradient: linear-gradient(135deg, #ffe898 0%, #d4af37 45%, #8a5e16 100%);
            --gold-border: rgba(212, 175, 55, 0.35);
            
            --bg-dark: #030406;
            --card-dark: rgba(13, 16, 23, 0.75);
            
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-heading: 'Outfit', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #030406;
            --card-bg: rgba(15, 18, 28, 0.75);
            --card-border: rgba(212, 175, 55, 0.25);
            --card-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.9), 0 0 50px rgba(212, 175, 55, 0.08);

            --text-title: #f8fafc;
            --text-subtitle: #94a3b8;
            --text-main: #e2e8f0;
            --text-gold: #e6c260;

            --box-bg: rgba(255, 255, 255, 0.03);
            --box-bg-hover: rgba(212, 175, 55, 0.12);
            --box-border: rgba(255, 255, 255, 0.08);

            --nav-bg: rgba(10, 13, 20, 0.85);
            --toast-bg: rgba(15, 23, 42, 0.95);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(180, 130, 30, 0.3);
            --card-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.12), 0 0 30px rgba(212, 175, 55, 0.05);

            --text-title: #0f172a;
            --text-subtitle: #475569;
            --text-main: #1e293b;
            --text-gold: #a17416;

            --box-bg: rgba(255, 255, 255, 0.65);
            --box-bg-hover: rgba(212, 175, 55, 0.15);
            --box-border: rgba(0, 0, 0, 0.08);

            --nav-bg: rgba(255, 255, 255, 0.85);
            --toast-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100svh;
            width: 100%;
            background-color: var(--bg-color);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Ambient Animated Background Lights */
        .aurora-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .aurora-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.35;
            border-radius: 50%;
            animation: floatBlob 18s infinite alternate ease-in-out;
        }

        .aurora-blob-1 {
            top: -10%; left: -10%;
            width: 450px; height: 450px;
            background: radial-gradient(circle, #d4af37 0%, transparent 70%);
        }

        .aurora-blob-2 {
            bottom: -10%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
            animation-delay: -6s;
        }

        .aurora-blob-3 {
            top: 40%; right: 20%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            animation-delay: -12s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(-40px, 80px) scale(0.95); }
        }

        /* Container & Card Layout */
        body {
            padding: 24px 16px;
        }

        .app-card {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            box-shadow: var(--card-shadow);
            padding: 32px 28px 100px 28px; /* Tabbar için alt padding */
            overflow: hidden;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease, background 0.3s ease;
            transform-style: preserve-3d;
        }

        /* Card Top Header Elements */
        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .vip-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid var(--gold-border);
            color: var(--text-gold);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .theme-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-title);
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-btn:hover {
            transform: scale(1.12) rotate(18deg);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        /* Profile Header */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .avatar-container {
            position: relative;
            margin-bottom: 16px;
        }

        .avatar-box {
            width: 96px;
            height: 96px;
            border-radius: 28px;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #030406;
            font-size: 42px;
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 1;
        }

        .status-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 22px;
            height: 22px;
            background: #10b981;
            border: 3.5px solid var(--bg-dark);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        h1.brand-title {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        p.brand-subtitle {
            color: var(--text-subtitle);
            font-size: 13.5px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* Dynamic Pages Engine */
        .pages-container {
            position: relative;
            width: 100%;
            min-height: 290px;
        }

        .page {
            position: absolute;
            top: 0; left: 0; width: 100%;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.97);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .page.active {
            position: relative;
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* Grid Action Buttons */
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 22px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-title);
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .action-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle 100px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(212, 175, 55, 0.2), transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .action-card:hover::before { opacity: 1; }

        .action-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-border);
            background: var(--box-bg-hover);
            box-shadow: 0 12px 25px rgba(212, 175, 55, 0.12);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .icon-google { background: linear-gradient(135deg, #4285f4, #1a73e8); color: #fff; }
        .icon-instagram { background: linear-gradient(135deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888); color: #fff; }
        .icon-phone { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .icon-vcard { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }

        .card-details {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 0;
        }

        .card-details span {
            font-size: 11px;
            color: var(--text-subtitle);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-details b {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-title);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Detail List Items (IBAN / Phone / Email) */
        .info-tile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 20px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            margin-bottom: 12px;
            transition: all 0.25s ease;
        }

        .info-tile:hover {
            border-color: var(--gold-border);
            background: var(--box-bg-hover);
        }

        .info-meta {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 0;
            gap: 2px;
        }

        .info-meta label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .info-meta value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-title);
            word-break: break-all;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-title);
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 12px;
            transition: all 0.25s ease;
        }

        .icon-btn:hover {
            background: var(--gold-gradient);
            color: #030406;
            border-color: transparent;
            transform: scale(1.08);
        }

        /* Bank Select Grid */
        .section-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-subtitle);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 18px 0 10px 4px;
            text-align: left;
        }

        .bank-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .bank-chip {
            height: 50px;
            border-radius: 16px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            color: var(--text-title);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .bank-chip img {
            max-width: 80%;
            max-height: 28px;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

        .bank-chip-text {
            position: absolute;
            z-index: 1;
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        .bank-chip:hover {
            border-color: var(--gold-border);
            background: var(--box-bg-hover);
            transform: translateY(-2px);
        }

        /* Glassmorphism Bottom Navigation Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 56px);
            max-width: 460px;
            height: 64px;
            background: var(--nav-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 50;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30%;
            height: 48px;
            border-radius: 20px;
            color: var(--text-subtitle);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
        }

        .tab-item i {
            font-size: 17px;
            transition: transform 0.3s ease;
        }

        .tab-item span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .tab-item.active {
            color: #030406;
            background: var(--gold-gradient);
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
        }

        .tab-item.active i {
            transform: scale(1.15);
        }

        /* Toast Feedback */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translate(-50%, 30px) scale(0.9);
            background: var(--toast-bg);
            border: 1px solid var(--gold-border);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 30px;
            color: var(--text-title);
            font-weight: 700;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        .toast i {
            color: var(--gold-primary);
            font-size: 16px;
        }

        @media (max-width: 480px) {
            body { padding: 12px 10px; }
            .app-card { padding: 24px 18px 90px 18px; border-radius: 30px; }
            .grid-buttons { grid-template-columns: 1fr; }
            .bank-grid { grid-template-columns: repeat(2, 1fr); }
            .tab-bar { width: calc(100% - 36px); bottom: 14px; }
        }
    </style>
</head>

        <!-- Glassmorphic Bottom Navigation -->

            </button>

                <i class="fa-regular fa-credit-card"></i>
                <span>Ödeme</span>

                <span>İletişim</span>
            </button>
        </nav>

    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastBox">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastText">Kopyalandı!</span>
    </div>

    <script>
        // Core Business Configurations
        const CONFIG = {
            name: "Luka Mersin",
            subtitle: "VIP Hizmetler & Ödeme Portalı",
            receiverName: "Özgür Dankoz",
            iban: "TR00 0000 0000 0000 0000 0000 00",
            phone: "+90 500 000 00 00",
            email: "info@lukamersin.com",
            address: "Mersin, Türkiye",
            mapsUrl: "https://maps.google.com/?q=36.798782,34.627697",
            instagramUser: "derenurumgl"
        };

        const BANKS_APP = {
            ziraat: { app: "https://apps.apple.com/tr/app/ziraat-mobil/id670138240", web: "https://www.ziraatbank.com.tr" },
            garanti: { app: "https://apps.apple.com/tr/app/garanti-bbva-mobil/id431835900", web: "https://www.garantibbva.com.tr" },
            isbankasi: { app: "https://apps.apple.com/tr/app/i%C5%9Fcep/id438234390", web: "https://www.isbank.com.tr" },
            yapikredi: { app: "https://apps.apple.com/tr/app/yap%C4%B1-kredi-mobil/id441228221", web: "https://www.yapikredi.com.tr" },
            akbank: { app: "https://apps.apple.com/tr/app/akbank/id400300185", web: "https://www.akbank.com" },
            vakifbank: { app: "https://apps.apple.com/tr/app/vak%C4%B1fbank-mobil/id525952382", web: "https://www.vakifbank.com.tr" }
        };

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
            init3DTilt();
            initMouseTracking();
        });

        function initApp() {
            document.getElementById("displayTitle").textContent = CONFIG.name;
            document.getElementById("displaySubtitle").textContent = CONFIG.subtitle;
            document.getElementById("btnMap").href = CONFIG.mapsUrl;
            document.getElementById("btnInstagram").href = `https://instagram.com/${CONFIG.instagramUser}`;
            document.getElementById("btnCall").href = `tel:${CONFIG.phone.replace(/\s+/g, '')}`;
            
            document.getElementById("valName").textContent = CONFIG.receiverName;
            document.getElementById("valIban").textContent = CONFIG.iban;
            document.getElementById("valPhone").textContent = CONFIG.phone;
            document.getElementById("valEmail").textContent = CONFIG.email;
            document.getElementById("valAddress").textContent = CONFIG.address;

            // Tema Yükle
            const savedTheme = localStorage.getItem("app_theme") || "dark";
            setTheme(savedTheme);
        }

        // Tab Switching Engine
        function switchTab(pageId, tabElement) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));

            document.getElementById(pageId).classList.add("active");
            tabElement.classList.add("active");
        }

        // Theme Engine
        function toggleTheme() {
            const current = document.documentElement.getAttribute("data-theme");
            setTheme(current === "dark" ? "light" : "dark");
        }

        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("app_theme", theme);
            const icon = document.getElementById("themeIcon");
            icon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        // Copy Data to Clipboard
        async function copyData(elementId, label, btn) {
            const text = document.getElementById(elementId).textContent.trim();
            try {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                } else {
                    fallbackCopy(text);
                }
                showToast(`${label} Kopyalandı!`);
                animateBtn(btn);
            } catch (e) {
                showToast("Kopyalanamadı!");
            }
        }

        function animateBtn(btn) {
            if (!btn) return;
            const icon = btn.querySelector("i");
            const oldClass = icon.className;
            icon.className = "fa-solid fa-check";
            btn.style.background = "var(--gold-gradient)";
            btn.style.color = "#030406";
            setTimeout(() => {
                icon.className = oldClass;
                btn.style.background = "";
                btn.style.color = "";
            }, 1500);
        }

        function fallbackCopy(text) {
            const area = document.createElement("textarea");
            area.value = text;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
        }

        // Toast Launcher
        function showToast(msg) {
            const toast = document.getElementById("toastBox");
            document.getElementById("toastText").textContent = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        // Open Bank Apps
        function openBankApp(bankKey) {
            const bank = BANKS_APP[bankKey];
            if (!bank) return;

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                window.location.href = bank.app;
            } else {
                window.open(bank.web, "_blank");
            }
        }

        // Advanced vCard Generator (.vcf)
        function downloadVCard() {
            const vCardContent = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `FN:${CONFIG.receiverName}`,
                `ORG:${CONFIG.name}`,
                `TITLE:${CONFIG.subtitle}`,
                `TEL;TYPE=CELL:${CONFIG.phone}`,
                `EMAIL;TYPE=WORK:${CONFIG.email}`,
                `ADR;TYPE=WORK:;;${CONFIG.address};;;;`,
                `URL:${CONFIG.mapsUrl}`,
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vCardContent], { type: "text/vcard;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${CONFIG.name.replace(/\s+/g, '_')}_vCard.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast("vCard Rehbere İndirildi!");
        }

        // Masaüstü 3D Tilt Efekti
        function init3DTilt() {
            const card = document.getElementById("appCard");
            if (window.innerWidth < 768) return;

            document.addEventListener("mousemove", (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }

        // Radial Mouse Tracking on Hover
        function initMouseTracking() {
            document.querySelectorAll(".action-card").forEach(card => {
                card.addEventListener("mousemove", (e) => {
                    const rect = card.getBoundingClientRect();
                    card.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
                    card.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
                });
            });
        }
    </script>
</body>
</html>
