<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kartvizit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2.5rem;
            color: white;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-open {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-closed {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .info-box {
            background-color: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .iban-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        /* Pop-up Modalları */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        #qrcode img {
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="card">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">
            <i class="fa-solid fa-moon"></i>
        </button>

        <div class="profile-header">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <h2>Ad Soyad</h2>
            <p style="color: var(--text-sub);">Unvan / Şirket Adı</p>
            <div id="statusBadge" class="status-badge"></div>
        </div>

        <button class="btn btn-primary" onclick="downloadVCard()">
            <i class="fa-solid fa-user-plus"></i> Rehbere Kaydet
        </button>

        <div class="info-box iban-field" onclick="copyIBAN('TR00 0000 0000 0000 0000 0000 00')">
            <div>
                <small style="color: var(--text-sub);">IBAN (Tıkla Kopyala)</small>
                <p style="font-size: 0.9rem; font-weight: bold;">TR00 0000... 0000 00</p>
            </div>
            <i class="fa-regular fa-copy"></i>
        </div>

        <a href="https://maps.google.com" target="_blank" class="btn">
            <i class="fa-solid fa-location-dot"></i> Yol Tarifi Al
        </a>

        <a href="katalog.pdf" download class="btn">
            <i class="fa-solid fa-file-pdf"></i> Kataloğu İndir
        </a>

        <button class="btn" onclick="openModal('qrModal')">
            <i class="fa-solid fa-qrcode"></i> QR Kodumu Göster
        </button>

        <button class="btn" onclick="openModal('appointmentModal')">
            <i class="fa-solid fa-calendar-check"></i> Randevu Al
        </button>
    </div>

    <div id="qrModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('qrModal')">&times;</span>
            <h3>Kartvizit QR Kodu</h3>
            <div id="qrcode"></div>
            <p style="font-size: 0.85rem; color: var(--text-sub);">Kameranızla okutabilirsiniz.</p>
        </div>
    </div>

    <div id="qrModal" class="modal" id="appointmentModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('appointmentModal')">&times;</span>
            <h3>Randevu Talebi</h3>
            <p style="margin: 15px 0; font-size: 0.9rem;">Calendly veya iletişim formunuz buraya gelecek.</p>
        </div>
    </div>

    <div id="toast" class="toast">IBAN kopyalandı!</div>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXX'); // Kendi Google Analytics ID'nizi girin
    </script>

    <script>
        // 1. Karanlık / Aydınlık Mod
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon').querySelector('i');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-sun';
            } else {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'fa-solid fa-moon';
            }
        }

        // 2. Canlı Çalışma Saatleri Durumu (Örnek: 09:00 - 18:00)
        function checkStatus() {
            const now = new Date();
            const hour = now.getHours();
            const badge = document.getElementById('statusBadge');
            
            if (hour >= 9 && hour < 18) {
                badge.textContent = '• Şu an Açık';
                badge.className = 'status-badge status-open';
            } else {
                badge.textContent = '• Şu an Kapalı';
                badge.className = 'status-badge status-closed';
            }
        }
        checkStatus();

        // 3. vCard (.vcf) Dosyası Oluşturma ve İndirme
        function downloadVCard() {
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
FN:Ad Soyad
ORG:Şirket Adı
TITLE:Unvan
TEL;TYPE=CELL:+905000000000
EMAIL:ornek@email.com
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'kartvizit.vcf';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // 4. IBAN Kopyalama
        function copyIBAN(iban) {
            navigator.clipboard.writeText(iban);
            const toast = document.getElementById("toast");
            toast.className = "toast show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // 5. Dinamik QR Kod Üretimi
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 180,
            height: 180
        });

        // Modal Kontrolleri
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
