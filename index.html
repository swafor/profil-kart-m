<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme İletişim & VIP Panel</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: linear-gradient(135deg, #2563EB, #1D4ED8);
            --primary-pink: linear-gradient(135deg, #E1306C, #C13584, #833AB4);
            --primary-green: linear-gradient(135deg, #059669, #047857);
            /* Elit Mor Varyasyonu */
            --primary-purple: linear-gradient(135deg, #8B5CF6, #6366F1, #4F46E5);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #020617);
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.15);
            --text-title: #FFFFFF;
            --text-subtitle: #94A3B8;
            --text-main: #F8FAFC;
            --text-label: #64748B;
            --box-bg: rgba(255, 255, 255, 0.03);
            --box-bg-hover: rgba(255, 255, 255, 0.08);
            --box-border: rgba(255, 255, 255, 0.08);
            --toast-bg: #0F172A;
            --toast-text: #FFFFFF;
        }

        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at top right, #f3e8ff, #e0e7ff 60%, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.15);
            --text-title: #0F172A;
            --text-subtitle: #475569;
            --text-main: #0F172A;
            --text-label: #64748B;
            --box-bg: rgba(255, 255, 255, 0.5);
            --box-bg-hover: rgba(255, 255, 255, 0.8);
            --box-border: rgba(255, 255, 255, 0.6);
            --toast-bg: #FFFFFF;
            --toast-text: #0F172A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            width: 100%;
            max-width: 380px;
            border-radius: 32px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 44px 28px;
            position: relative;
            overflow: hidden;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-title);
            font-size: 14px;
            cursor: pointer;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
            background: var(--box-bg-hover);
        }

        .page-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .sub-page {
            position: absolute;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            padding: 36px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-card.show-contact .page-main {
            transform: translateX(-100%) scale(0.92);
            opacity: 0;
            pointer-events: none;
        }

        .app-card.show-contact #contactPage {
            left: 0;
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-subtitle);
            margin-bottom: 28px;
            line-height: 1.5;
            font-weight: 500;
        }

        .btn-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .btn-contact { 
            background: var(--primary-purple); 
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .info-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .copy-icon-btn {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            color: #8B5CF6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-icon-btn:hover {
            background: #8B5CF6;
            color: #FFFFFF;
        }

        .btn-back {
            background: var(--box-bg);
            color: var(--text-main);
            border: 1px solid var(--box-border);
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>

        <div class="page page-main">
            <h1>LUKA MERSİN</h1>
            <p class="subtitle">Lüks Dijital İletişim Paneli</p>

            <div class="btn-list">
                <button class="btn btn-contact" onclick="openPage('show-contact')">
                    <i class="fa-solid fa-address-book"></i> İletişim Bilgileri
                </button>
            </div>
        </div>

        <div class="sub-page" id="contactPage">
            <div>
                <div style="text-align: center; margin-bottom: 24px;">
                    <h2 style="font-size: 20px; color: var(--text-title); font-weight: 800;">İletişim</h2>
                    <p class="subtitle" style="margin-bottom: 0;">Doğrudan İletişim Kanalları</p>
                </div>

                <div class="info-box">
                    <div>
                        <div class="info-label">Telefon Numarası</div>
                        <div class="info-value" id="phoneText">+90 555 123 45 67</div>
                    </div>
                    <button class="copy-icon-btn" onclick="copyText('phoneText')"><i class="fa-regular fa-copy"></i></button>
                </div>

                <div class="info-box">
                    <div>
                        <div class="info-label">E-Posta Adresi</div>
                        <div class="info-value" id="emailText">info@isletmeadi.com</div>
                    </div>
                    <button class="copy-icon-btn" onclick="copyText('emailText')"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <button class="btn-back" onclick="closePages()"><i class="fa-solid fa-arrow-left"></i> Geri Dön</button>
        </div>
    </div>

    <script>
        function openPage(cls) { document.getElementById('appCard').classList.add(cls); }
        function closePages() { document.getElementById('appCard').classList.remove('show-contact'); }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert('Kopyalandı!');
        }
    </script>
</body>
</html>
