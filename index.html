<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme İletişim & IBAN</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --emerald-gradient: linear-gradient(135deg, #059669 0%, #10B981 100%);
            --amber-gradient: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
            --slate-gradient: linear-gradient(135deg, #334155 0%, #475569 100%);
        }

        /* KARANLIK TEMA */
        [data-theme="dark"] {
            --bg-color: #0b1329;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --box-bg: rgba(30, 41, 59, 0.6);
            --box-hover: rgba(51, 65, 85, 0.8);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --accent-green: #34D399;
            --accent-yellow: #FBBF24;
            --toast-bg: #1E293B;
            --toast-text: #FFFFFF;
        }

        /* AYDINLIK TEMA */
        [data-theme="light"] {
            --bg-color: #F1F5F9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(226, 232, 240, 0.8);
            --box-bg: rgba(248, 250, 252, 0.9);
            --box-hover: rgba(241, 245, 249, 1);
            --text-main: #0F172A;
            --text-sub: #475569;
            --accent-green: #059669;
            --accent-yellow: #D97706;
            --toast-bg: #FFFFFF;
            --toast-text: #0F172A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.12) 0px, transparent 50%);
        }

        /* ANA KART */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 36px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* ÜST BAŞLIK VE TEMA DÜĞMESİ */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .brand-info h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-info p {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .theme-toggle-btn {
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.08);
        }

        /* BENTO GRID DÜZENİ */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .bento-item {
            border-radius: 22px;
            padding: 20px 16px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 110px;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .bento-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.3);
        }

        .bento-full {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            min-height: 80px;
        }

        /* RENK ATAMALARI */
        .bg-google {
            background: var(--amber-gradient);
        }

        .bg-instagram {
            background: var(--emerald-gradient);
        }

        .bg-iban {
            background: var(--slate-gradient);
        }

        .bg-contact {
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .bento-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .bento-full .bento-icon {
            margin-bottom: 0;
            font-size: 28px;
        }

        .bento-title {
            font-weight: 700;
            font-size: 15px;
        }

        .bento-arrow {
            position: absolute;
            top: 16px;
            right: 16px;
            opacity: 0.6;
            font-size: 12px;
        }

        /* AÇILIR ALT PANELLER (Slide-Down Efekti) */
        .sub-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 20;
        }

        .app-container.show-iban #ibanPanel,
        .app-container.show-contact #contactPanel {
            transform: translateY(0);
            opacity: 1;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .panel-header h2 {
            font-size: 20px;
            color: var(--text-main);
            font-weight: 800;
        }

        .close-btn {
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* BİLGİ KUTULARI */
        .info-card {
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-card:hover {
            background: var(--box-hover);
        }

        .info-text span {
            display: block;
        }

        .info-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-all;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
        }

        .copy-btn:hover {
            color: var(--accent-green);
        }

        /* HIZLI BANKA GRID */
        .bank-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-sub);
            margin: 14px 0 8px 0;
            text-align: center;
            text-transform: uppercase;
        }

        .bank-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .bank-btn {
            background: var(--box-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 4px;
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .bank-btn:hover {
            background: var(--box-hover);
            border-color: var(--accent-green);
        }

        /* TOAST BİLDİRİM */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--card-border);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- ÜST BAŞLIK -->
        <div class="header-bar">
            <div class="brand-info">
                <h1>İşletme Adı</h1>
                <p>Sosyal Medya & İletişim</p>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Temayı Değiştir">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>
        </div>

        <!-- YENİ BENTO GRID YAPISI -->
        <div class="bento-grid">
            
            <!-- GOOGLE (GENİŞ KART) -->
            <a href="https://maps.app.goo.gl/6BTDZ5b5pp5bGT728" target="_blank" class="bento-item bento-full bg-google">
                <div style="display: flex; align-items: center; gap: 14px;">
                    <i class="fa-brands fa-google bento-icon"></i>
                    <div>
                        <div class="bento-title">Google Haritalar</div>
                        <div style="font-size: 11px; opacity: 0.9;">Bizi değerlendirin ve yol tarifi alın</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>

            <!-- INSTAGRAM -->
            <a href="https://www.instagram.com/luka.mersin/" target="_blank" class="bento-item bg-instagram">
                <i class="fa-solid fa-arrow-up-right-from-square bento-arrow"></i>
                <i class="fa-brands fa-instagram bento-icon"></i>
                <span class="bento-title">Instagram</span>
            </a>

            <!-- IBAN -->
            <button class="bento-item bg-iban" onclick="openPanel('show-iban')">
                <i class="fa-solid fa-chevron-right bento-arrow"></i>
                <i class="fa-regular fa-credit-card bento-icon"></i>
                <span class="bento-title">IBAN AL</span>
            </button>

            <!-- İLETİŞİM (GENİŞ KART) -->
            <button class="bento-item bento-full bg-contact" onclick="openPanel('show-contact')">
                <div style="display: flex; align-items: center; gap: 14px;">
                    <i class="fa-solid fa-headset bento-icon" style="color: var(--accent-green);"></i>
                    <div style="text-align: left;">
                        <div class="bento-title">İletişim Bilgileri</div>
                        <div style="font-size: 11px; color: var(--text-sub);">Telefon ve E-Posta detayları</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-sub);"></i>
            </button>

        </div>

        <!-- IBAN PANELİ -->
        <div class="sub-panel" id="ibanPanel">
            <div>
                <div class="panel-header">
                    <h2>Banka Bilgileri</h2>
                    <button class="close-btn" onclick="closePanel()"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="info-card">
                    <div class="info-text">
                        <span class="info-label">ALICI</span>
                        <span class="info-value" id="nameText">Ahmet Yılmaz</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('nameText', 'İsim Soyisim')"><i class="fa-regular fa-copy"></i></button>
                </div>

                <div class="info-card">
                    <div class="info-text">
                        <span class="info-label">IBAN</span>
                        <span class="info-value" id="ibanText">TR92 0006 2000 0000 0000 0000 00</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('ibanText', 'IBAN')"><i class="fa-regular fa-copy"></i></button>
                </div>

                <div class="bank-title">Banka Uygulamasını Aç</div>
                <div class="bank-grid">
                    <button class="bank-btn" onclick="copyAndOpenBank('ziraat')">Ziraat</button>
                    <button class="bank-btn" onclick="copyAndOpenBank('garanti')">Garanti</button>
                    <button class="bank-btn" onclick="copyAndOpenBank('isbankasi')">İş Bankası</button>
                    <button class="bank-btn" onclick="copyAndOpenBank('yapikredi')">Yapı Kredi</button>
                    <button class="bank-btn" onclick="copyAndOpenBank('akbank')">Akbank</button>
                    <button class="bank-btn" onclick="copyAndOpenBank('vakifbank')">VakıfBank</button>
                </div>
            </div>
        </div>

        <!-- İLETİŞİM PANELİ -->
        <div class="sub-panel" id="contactPanel">
            <div>
                <div class="panel-header">
                    <h2>İletişim</h2>
                    <button class="close-btn" onclick="closePanel()"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="info-card">
                    <div class="info-text">
                        <span class="info-label">TELEFON</span>
                        <span class="info-value" id="phoneText">+90 555 123 45 67</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('phoneText', 'Telefon')"><i class="fa-regular fa-copy"></i></button>
                </div>

                <div class="info-card">
                    <div class="info-text">
                        <span class="info-label">E-POSTA</span>
                        <span class="info-value" id="emailText">info@isletmeadi.com</span>
                    </div>
                    <button class="copy-btn" onclick="copyText('emailText', 'E-Posta')"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>

    </div>

    <!-- TOAST BİLDİRİM -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--accent-green);"></i>
        <span id="toastMsg">Kopyalandı!</span>
    </div>

    <script>
        const appContainer = document.getElementById('appContainer');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const themeIcon = document.getElementById('themeIcon');

        // TEMAYI İLK YÜKLEME VE DEĞİŞTİRME
        function initTheme() {
            const savedTheme = localStorage.getItem('selectedTheme') || 'dark';
            setTheme(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('selectedTheme', theme);
            themeIcon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        initTheme();

        // PANEL GEÇİŞLERİ
        function openPanel(panelClass) {
            appContainer.classList.remove('show-iban', 'show-contact');
            appContainer.classList.add(panelClass);
        }

        function closePanel() {
            appContainer.classList.remove('show-iban', 'show-contact');
        }

        // KOPYALAMA
        function copyText(elementId, label) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} kopyalandı!`);
            });
        }

        // BANKA BAĞLANTILARI
        const bankLinks = {
            yapikredi: { ios: "ykb://", android: "intent://#Intent;scheme=ykb;package=com.ykb.android;S.browser_fallback_url=https://www.yapikredi.com.tr;end", web: "https://www.yapikredi.com.tr" },
            ziraat: { ios: "ziraatmobile://", android: "intent://#Intent;scheme=ziraatmobile;package=com.ziraat.ziraatmobil;S.browser_fallback_url=https://www.ziraatbank.com.tr;end", web: "https://www.ziraatbank.com.tr" },
            garanti: { ios: "garanticep://", android: "intent://#Intent;scheme=garanticep;package=com.garanti.cepsubesi;S.browser_fallback_url=https://www.garantibbva.com.tr;end", web: "https://www.garantibbva.com.tr" },
            isbankasi: { ios: "iscep://", android: "intent://#Intent;scheme=iscep;package=com.isbank.iscep;S.browser_fallback_url=https://www.isbank.com.tr;end", web: "https://www.isbank.com.tr" },
            akbank: { ios: "akbankdirekt://", android: "intent://#Intent;scheme=akbankdirekt;package=com.akbank.android.apps.akbank_direkt;S.browser_fallback_url=https://www.akbank.com;end", web: "https://www.akbank.com" },
            vakifbank: { ios: "vakifbankmobile://", android: "intent://#Intent;scheme=vakifbankmobile;package=com.vakifbank.mobile;S.browser_fallback_url=https://www.vakifbank.com.tr;end", web: "https://www.vakifbank.com.tr" }
        };

        function copyAndOpenBank(bankKey) {
            const ibanText = document.getElementById('ibanText').innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(ibanText);
            showToast('IBAN kopyalandı, yönlendiriliyor...');

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent);
            const bank = bankLinks[bankKey];

            setTimeout(() => {
                if (isAndroid && bank.android) window.location.href = bank.android;
                else if (isIOS && bank.ios) window.location.href = bank.ios;
                else window.open(bank.web, '_blank');
            }, 500);
        }

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>
