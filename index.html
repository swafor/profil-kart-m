<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>İşletme Profili</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 text-align: center;
 background-color: #f4f4f4;
 padding: 20px;
 }
 .profile-card {
 background: white;
 padding: 30px;
 border-radius: 15px;
 box-shadow: 0 4px 8px rgba(0,0,0,0.1);
 max-width: 400px;
 margin: 0 auto;
 }
 .btn {
 display: block;
 width: 100%;
 padding: 15px;
 margin: 10px 0;
 border: none;
 border-radius: 8px;
 font-size: 16px;
 font-weight: bold;
 cursor: pointer;
 text-decoration: none;
 color: white;
 transition: opacity 0.3s ease;
 }
 .btn-google { background-color: #4285F4; }
 .btn-instagram { background-color: #E1306C; }
 .btn-iban { background-color: #28a745; }
 .btn:hover { opacity: 0.9; }
 .copy-alert {
 display: none;
 color: #28a745;
 font-weight: bold;
 margin-top: 15px;
 font-size: 14px;
 }
 </style>
</head>
<body>

 <div class="profile-card">
 <h2>İşletme Adı</h2>
 <p>Bizi değerlendirin ve sosyal medyada takip edin.</p>
 
 <a href="https://g.page/your-business/review" class="btn btn-google" target="_blank">Google'da Değerlendir</a>
 <a href="https://instagram.com/your-business" class="btn btn-instagram" target="_blank">Instagram'da Takip Et</a>
 <button class="btn btn-iban" onclick="copyIban()">IBAN Kopyala</button>

 <div id="copy-message" class="copy-alert">
 İşletme bilgileri ve IBAN kopyalandı!
 </div>
 </div>

 <script>
 function copyIban() {
 const businessName = "İŞLETME ADI SOYADI";
 const ibanNumber = "TR2859365825591759275";
 const textToCopy = `İsim Soyisim: ${Ayşegül Er}\nIBAN: ${ibanNumber}`;

 navigator.clipboard.writeText(textToCopy).then(() => {
 const alertBox = document.getElementById('copy-message');
 alertBox.style.display = 'block';
 setTimeout(() => {
 alertBox.style.display = 'none';
 }, 2000);
 }).catch(err => {
 console.error('Kopyalama başarısız oldu: ', err);
 });
 }
 </script>

</body>
</html>
