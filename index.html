<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme İletişim & IBAN</title>
    <!-- FontAwesome İkon Kütüphanesi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: linear-gradient(135deg, #4F46E5, #3B82F6);
            --primary-pink: linear-gradient(135deg, #F43F5E, #E1306C, #F59E0B);
            --primary-green: linear-gradient(135deg, #10B981, #059669);
            --text-main: #0F172A;
            --text-sub: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Canlı ve Hareketli Arka Plan */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ana Konteyner: Senkronize Renk Değiştiren Koyu Cam Efekti */
        .app-card {
            background: linear-gradient(-45deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6), rgba(30, 58, 138, 0.4), rgba(76, 29, 149, 0.4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 380px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            padding: 36px 24px;
            position: relative;
            overflow: hidden;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Sayfa Geçiş Ekranları */
        .page {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .page-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .page-iban {
            position: absolute;
            top: 0;
            left: 100%;
            width: 100%;
            height: 100%;
            padding: 30px 24px;
            background: linear-gradient(-45deg, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.7), rgba(30, 58, 138, 0.5), rgba(76, 29, 149, 0.5));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            overflow-y: auto;
        }

        /* IBAN Sayfası Aktif Durumu */
        .app-card.show-iban .page-main {
            transform: translateX(-100%) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }

        .app-card.show-iban .page-iban {
            left: 0;
            opacity: 1;
            pointer-events: auto;
        }

        /* Başlıklar */
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #E2E8F0;
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Butonlar */
        .btn-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-google { 
            background: var(--primary-blue); 
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5);
        }
        .btn-instagram { 
            background: var(--primary-pink); 
            box-shadow: 0 10px 20px -5px rgba(225, 48, 108, 0.5);
        }
        .btn-iban { 
            background: var(--primary-green); 
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.5);
        }

        /* IBAN Kart Tasarımı */
        .iban-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .iban-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #FFFFFF;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .info-box:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .info-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            color: #94A3B8;
            letter-spacing: 0.8px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 700;
            color: #F1F5F9;
            word-break: break-all;
        }

        .copy-icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F1F5F9;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .copy-icon-btn:hover {
            background: #10B981;
            color: white;
            border-color: #10B981;
            transform: scale(1.1);
        }

        /* Banka Hızlı Erişim Butonları */
        .bank-section-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            color: #94A3B8;
            letter-spacing: 0.8px;
            margin: 16px 0 8px 0;
            text-align: center;
        }

        .bank-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-bank {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            color: #F1F5F9;
            font-weight: 600;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-bank:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #F1F5F9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            font-size: 14px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        /* Toast Bildirim */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0F172A;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast i {
            color: #10B981;
            font-size: 18px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        
        <!-- ANA SAYFA -->
        <div class="page page-main">
            <h1>İşletme Adı</h1>
            <p class="subtitle">Bizi değerlendirin ve sosyal medyada takip edin.</p>

            <div class="btn-list">
                <a href="https://www.google.com/local/place/fid/0x1527f30955ebcba3:0xe53ff472d630629f/photosphere?iu=https://streetviewpixels-pa.googleapis.com/v1/thumbnail?panoid%3D-Y7bSG87Ck0suvH280VllA%26cb_client%3Dsearch.gws-prod.gps%26yaw%3D172.95712%26pitch%3D0%26thumbfov%3D100%26w%3D0%26h%3D0&ik=CAISFi1ZN2JTRzg3Q2swc3V2SDI4MFZsbEE%3D&sa=X&ved=2ahUKEwjawsXEh8aWAxXf8bsIHew6CJkQpx96BAgbEBA" target="_blank" class="btn btn-google">
                    <i class="fa-brands fa-google"></i> Google'da Değerlendir
                </a>
                <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
                    <i class="fa-brands fa-instagram"></i> Instagram'da Takip Et
                </a>
                <button class="btn btn-iban" onclick="openIbanPage()">
                    <i class="fa-regular fa-credit-card"></i> IBAN Bilgileri
                </button>
            </div>
        </div>

        <!-- IBAN VE İSİM SAYFASI -->
        <div class="page page-iban">
            <div>
                <div class="iban-header">
                    <h2>Banka Bilgileri</h2>
                    <p class="subtitle" style="margin-bottom: 12px;">Bilgileri kopyalayıp bankanızı seçin</p>
                </div>

                <!-- Alıcı / İsim Soyisim -->
                <div class="info-box">
                    <div class="info-details">
                        <span class="info-label">ALICI İSİM SOYİSİM</span>
                        <span class="info-value" id="nameText">Ahmet Yılmaz</span>
                    </div>
                    <button class="copy-icon-btn" onclick="copyToClipboard('nameText', 'İsim Soyisim')" title="Kopyala">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <!-- IBAN -->
                <div class="info-box">
                    <div class="info-details">
                        <span class="info-label">IBAN NUMARASI</span>
                        <span class="info-value" id="ibanText">TR92 0006 2000 0000 0000 0000 00</span>
                    </div>
                    <button class="copy-icon-btn" onclick="copyToClipboard('ibanText', 'IBAN')" title="Kopyala">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>

                <!-- Banka Uygulaması Aç Butonları -->
                <div class="bank-section-title">IBAN Kopyala & Uygulama Aç</div>
                <div class="bank-grid">
                    <button class="btn-bank" onclick="copyAndOpenBank('ziraat')">
                        <i class="fa-solid fa-building-columns"></i> Ziraat
                    </button>
                    <button class="btn-bank" onclick="copyAndOpenBank('garanti')">
                        <i class="fa-solid fa-building-columns"></i> Garanti
                    </button>
                    <button class="btn-bank" onclick="copyAndOpenBank('isbankasi')">
                        <i class="fa-solid fa-building-columns"></i> İş Bankası
                    </button>
                    <button class="btn-bank" onclick="copyAndOpenBank('yapikredi')">
                        <i class="fa-solid fa-building-columns"></i> Yapı Kredi
                    </button>
                    <button class="btn-bank" onclick="copyAndOpenBank('akbank')">
                        <i class="fa-solid fa-building-columns"></i> Akbank
                    </button>
                    <button class="btn-bank" onclick="copyAndOpenBank('vakifbank')">
                        <i class="fa-solid fa-building-columns"></i> VakıfBank
                    </button>
                </div>
            </div>

            <!-- Geri Dön Butonu -->
            <button class="btn btn-back" onclick="closeIbanPage()">
                <i class="fa-solid fa-arrow-left"></i> Geri Dön
            </button>
        </div>

    </div>

    <!-- Kopyalandı Bildirimi (Toast) -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Kopyalandı!</span>
    </div>

    <script>
        const appCard = document.getElementById('appCard');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // Banka Deeplink Konfigürasyonu (iOS / Android)
        const bankLinks = {
            yapikredi: {
                ios: "ykb://",
                android: "intent://#Intent;scheme=ykb;package=com.ykb.android;end",
                web: "https://www.yapikredi.com.tr"
            },
            ziraat: {
                ios: "ziraatmobile://",
                android: "intent://#Intent;scheme=ziraatmobile;package=com.ziraat.ziraatmobil;end",
                web: "https://www.ziraatbank.com.tr"
            },
            garanti: {
                ios: "garanticep://",
                android: "intent://#Intent;scheme=garanticep;package=com.garanti.cepsubesi;end",
                web: "https://www.garantibbva.com.tr"
            },
            isbankasi: {
                ios: "iscep://",
                android: "intent://#Intent;scheme=iscep;package=com.isbank.iscep;end",
                web: "https://www.isbank.com.tr"
            },
            akbank: {
                ios: "akbankdirekt://",
                android: "intent://#Intent;scheme=akbankdirekt;package=com.akbank.android.apps.akbank_direkt;end",
                web: "https://www.akbank.com"
            },
            vakifbank: {
                ios: "vakifbankmobile://",
                android: "intent://#Intent;scheme=vakifbankmobile;package=com.vakifbank.mobile;end",
                web: "https://www.vakifbank.com.tr"
            }
        };

        function openIbanPage() {
            appCard.classList.add('show-iban');
        }

        function closeIbanPage() {
            appCard.classList.remove('show-iban');
        }

        function copyToClipboard(elementId, label) {
            const textToCopy = document.getElementById(elementId).innerText;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(`${label} kopyalandı!`);
            }).catch(err => {
                showToast('Kopyalama başarısız!');
            });
        }

        function copyAndOpenBank(bankKey) {
            const ibanText = document.getElementById('ibanText').innerText;
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            const bank = bankLinks[bankKey];

            // 1. Önce IBAN kopyalama işlemini gerçekleştir
            navigator.clipboard.writeText(ibanText).then(() => {
                showToast('IBAN kopyalandı, uygulama açılıyor...');

                // 2. İşletim sistemine uygun bağlantıyı tetikle
                setTimeout(() => {
                    if (isAndroid && bank.android) {
                        window.location.href = bank.android;
                    } else if (isIOS && bank.ios) {
                        window.location.href = bank.ios;
                    } else {
                        // Masaüstü veya bilinmeyen platformda web sitesini aç
                        window.open(bank.web, '_blank');
                    }
                }, 500);
            }).catch(err => {
                showToast('Kopyalama başarısız!');
            });
        }

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
